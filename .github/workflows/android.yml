name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Extract Project ZIP
      run: |
        mkdir -p extracted_project
        unzip -o *.zip -d extracted_project
        ROOT_DIR=$(find extracted_project -name "settings.gradle*" -o -name "build.gradle*" | head -n 1 | xargs dirname)
        echo "PROJECT_PATH=$ROOT_DIR" >> $GITHUB_ENV

    - name: Force Fix Compatibility
      run: |
        cd ${{ env.PROJECT_PATH }}
        
        # Replace Java version references in gradle files
        find . -type f \( -name "*.gradle" -o -name "*.gradle.kts" \) -exec sed -i 's/VERSION_1_8/VERSION_17/g' {} +
        find . -type f \( -name "*.gradle" -o -name "*.gradle.kts" \) -exec sed -i "s/'1.8'/'17'/g" {} +
        find . -type f \( -name "*.gradle" -o -name "*.gradle.kts" \) -exec sed -i 's/"1.8"/"17"/g' {} +

    - name: Build Debug APK
      run: |
        cd ${{ env.PROJECT_PATH }}
        gradle assembleDebug \
          -Dorg.gradle.java.home=$JAVA_HOME \
          -Pkotlin.compiler.jvmTarget=17 \
          --no-daemon

    - name: Find and Rename APK
      run: |
        APK_PATH=$(find ${{ env.PROJECT_PATH }} -name "*.apk" | head -n 1)
        mkdir -p output_apk
        cp "$APK_PATH" output_apk/Hersh-CryptoPatternFinder.apk

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Hersh-CryptoPatternFinder
        path: output_apk/Hersh-CryptoPatternFinder.apk
