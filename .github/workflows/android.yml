name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Extract Project ZIP
      run: |
        mkdir -p extracted_project
        unzip -o *.zip -d extracted_project
        ROOT_DIR=$(find extracted_project -name "settings.gradle*" -o -name "build.gradle*" | head -n 1 | xargs dirname)
        echo "PROJECT_PATH=$ROOT_DIR" >> $GITHUB_ENV

    - name: Overwrite Gradle Compatibility
      run: |
        cd ${{ env.PROJECT_PATH }}
        python3 -c "
        import os

        for root, dirs, files in os.walk('.'):
            for file in files:
                if file.endswith('.gradle') or file.endswith('.gradle.kts'):
                    path = os.path.join(root, file)
                    with open(path, 'r', encoding='utf-8', errors='ignore') as f:
                        lines = f.readlines()
                    
                    new_lines = []
                    for line in lines:
                        if 'sourceCompatibility' in line:
                            new_lines.append('        sourceCompatibility = JavaVersion.VERSION_17\n')
                        elif 'targetCompatibility' in line:
                            new_lines.append('        targetCompatibility = JavaVersion.VERSION_17\n')
                        elif 'jvmTarget' in line:
                            new_lines.append('        jvmTarget = \"17\"\n')
                        else:
                            new_lines.append(line)
                    
                    with open(path, 'w', encoding='utf-8') as f:
                        f.writelines(new_lines)
        "

    - name: Build Debug APK
      run: |
        cd ${{ env.PROJECT_PATH }}
        gradle assembleDebug -Dorg.gradle.java.home=$JAVA_HOME --no-daemon

    - name: Find and Rename APK
      run: |
        APK_PATH=$(find ${{ env.PROJECT_PATH }} -name "*.apk" | head -n 1)
        mkdir -p output_apk
        cp "$APK_PATH" output_apk/Hersh-CryptoPatternFinder.apk

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Hersh-CryptoPatternFinder
        path: output_apk/Hersh-CryptoPatternFinder.apk
